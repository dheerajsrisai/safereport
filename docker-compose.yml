name: safereport

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/safereport
      JWT_SECRET: change-this-safereport-secret-key-before-deploying-2024
      UPLOAD_DIR: /data/evidence
    volumes:
      - evidence:/data/evidence
    depends_on:
      - mongo
    ports:
      - "8082:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  evidence:
