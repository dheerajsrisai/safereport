server {
  listen 80;
  client_max_body_size 160m;
  access_log off;                      # privacy: no access logs with visitor IPs
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header X-Real-IP $remote_addr;   # used only by the in-memory rate limiter
    proxy_request_buffering on;
  }
  location / { try_files $uri /index.html; }
}
