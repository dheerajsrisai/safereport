server.port=8080
spring.application.name=safereport
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/safereport}
spring.data.mongodb.auto-index-creation=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=150MB

# Privacy: never write access logs (they would contain reporter IP addresses)
server.tomcat.accesslog.enabled=false
logging.level.org.springframework.web=WARN

# JWT for officers/admins (change the secret in production; 32+ characters)
app.jwt.secret=${JWT_SECRET:change-this-safereport-secret-key-before-deploying-2024}
app.jwt.expiration-ms=28800000

# Evidence files are stored here and are NOT publicly served
app.upload-dir=${UPLOAD_DIR:uploads}

# Anti-spam: max report submissions per IP per hour (kept in memory only)
app.rate.submit-per-hour=${RATE_SUBMIT:10}
